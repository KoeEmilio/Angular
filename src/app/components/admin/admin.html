<div class="admin-container">
  <header class="admin-header">
    <h1>Panel de Administración</h1>
    <div class="user-info">
      <span>Rol: {{ userRole }}</span>
      <button (click)="logout()" class="btn btn-logout">Cerrar Sesión</button>
    </div>
  </header>

  <nav class="admin-nav">
    <a routerLink="/admin/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/admin/usuarios" routerLinkActive="active">Usuarios</a>
    <a routerLink="/admin/configuracion" routerLinkActive="active">Configuración</a>
  </nav>

  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>
