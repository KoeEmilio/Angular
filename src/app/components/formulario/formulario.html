<div class="container">
  <h2>Formulario con CanDeactivate Guard</h2>
  
  <form>
    <div class="form-group">
      <label for="nombre">Nombre:</label>
      <input 
        type="text" 
        id="nombre"
        [(ngModel)]="nombre" 
        (input)="onInputChange()"
        class="form-control"
      >
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input 
        type="email" 
        id="email"
        [(ngModel)]="email" 
        (input)="onInputChange()"
        class="form-control"
      >
    </div>

    <button type="button" (click)="guardar()" class="btn btn-primary">
      Guardar
    </button>
  </form>

  <div class="navigation">
    <a routerLink="/inicio" class="btn btn-secondary">Ir a Inicio</a>
    <a routerLink="/contacto" class="btn btn-secondary">Ir a Contacto</a>
  </div>

  <div *ngIf="hasUnsavedChanges" class="alert">
    ⚠️ Tienes cambios sin guardar
  </div>
</div>
